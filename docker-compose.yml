services:
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/trace
      DATABASE_USER: trace
      DATABASE_PASSWORD: trace
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - trace-data:/var/lib/postgresql/data

volumes:
  trace-data:
